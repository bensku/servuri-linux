# Make generic initramfs, not one specific for build environment
hostonly="no"
hostonly_cmdline="no"

# bootc to switch root, btrfs to mount root we're switching to
add_dracutmodules+=" bootc btrfs "

# composefs needs a bunch of drivers, best not to assume they are around by default
# ... unless you want Tumbleweed updates to randomly make images not boot!
force_drivers+=" erofs overlay loop btrfs ext4 hpsa smartpqi megaraid_sas "
filesystems+=" erofs overlay btrfs ext4 "